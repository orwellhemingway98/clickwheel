name: ClickWheel
options:
  bundleIdPrefix: com.mfelouro
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  ClickWheel:
    type: application
    platform: macOS
    sources: [ClickWheel]
    info:
      path: ClickWheel/App/Info.plist
      properties:
        CFBundleName: ClickWheel
        CFBundleDisplayName: ClickWheel
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.music
        NSAppleEventsUsageDescription: "ClickWheel controls Apple Music and Spotify so it can show what's playing and play, pause or skip tracks."
    entitlements:
      path: ClickWheel/App/ClickWheel.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mfelouro.ClickWheel
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
  ClickWheelTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ClickWheelTests]
    dependencies:
      - target: ClickWheel
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClickWheel:
    build:
      targets:
        ClickWheel: all
    test:
      targets: [ClickWheelTests]
